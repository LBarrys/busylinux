name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: |
          f=pkgs/busylinux-init/files
          shellcheck -S warning -s sh *.sh tests/*.sh .github/*.sh pkgs/*/build \
            pkgs/*/scripts/* "$f"/rc? "$f"/sv* "$f"/supervise "$f"/acpi-poweroff \
            "$f"/initramfs-init "$f"/busylinux.sh

      - name: nftables ruleset
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables
          sudo nft -c -f pkgs/busylinux-init/files/nftables.conf

      - name: Kernel signature
        run: sh .github/kernel-bump.sh

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Package cache
        uses: actions/cache@v6
        with:
          path: cache
          key: build-${{ hashFiles('Dockerfile', '*.sh', 'pkgs/**') }}
          # build.sh rebuilds only the recipes that changed.
          restore-keys: build-

      - name: Build
        run: |
          docker build -t busylinux-builder .
          mkdir -p out cache
          docker run --rm -v "$PWD/out:/build/out" -v "$PWD/cache:/build/cache" \
            -e ALPINE_MIRROR=https://dl-cdn.alpinelinux.org/alpine -e VM_SUPPORT=1 \
            busylinux-builder
          sudo chown -R "$(id -u):$(id -g)" out cache

      - name: Boot test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf gdisk dosfstools
          sudo tests/boot-test.sh

      - name: Keep the console log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-test-log
          path: out/boot-test.log
          if-no-files-found: ignore
