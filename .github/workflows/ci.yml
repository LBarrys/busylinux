name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: |
          f=pkgs/busylinux-init/files
          shellcheck -S warning -s sh tools/* tests/*.sh .github/*.sh pkgs/*/build \
            "$f"/rc? "$f"/rc.local "$f"/sv* "$f"/supervise "$f"/acpi-poweroff \
            "$f"/busylinux.sh

      - name: nftables ruleset
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables
          sudo nft -c -f pkgs/busylinux-init/files/nftables.conf

      - name: Kernel signature
        run: sh .github/kernel-bump.sh

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Package cache
        uses: actions/cache@v6
        with:
          path: cache
          key: build-${{ hashFiles('Dockerfile', 'tools/*.sh', 'pkgs/**') }}
          # build.sh rebuilds only the recipes that changed.
          restore-keys: build-

      # A kernel compiled by any earlier run from the same inputs, from the
      # kernel-cache release: the Actions cache does not cross branches.
      - name: Prebuilt kernel
        id: kernel
        run: |
          # Only what changes the kernel: the base image and its tools, lib.sh
          # and the recipe, by content, so moving files or COPY lines does not.
          key=kernel-$({ grep -E '^(FROM|RUN) ' Dockerfile; cat tools/lib.sh
                         find pkgs/linux-busylinux -type f | LC_ALL=C sort |
                           while read -r f; do echo "${f##*/}"; cat "$f"; done
                         echo VM_SUPPORT=1; } | sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          mkdir -p prebuilt
          if gh release download kernel-cache -p "$key.apk" -O prebuilt/linux-busylinux.apk 2>/dev/null; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          docker build -t busylinux-builder .
          mkdir -p out cache
          docker run --rm -v "$PWD/out:/build/out" -v "$PWD/cache:/build/cache" \
            -v "$PWD/prebuilt:/build/prebuilt:ro" \
            -e ALPINE_MIRROR=https://dl-cdn.alpinelinux.org/alpine -e VM_SUPPORT=1 \
            busylinux-builder
          sudo chown -R "$(id -u):$(id -g)" out cache

      - name: Save the kernel for later runs
        if: steps.kernel.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          key=${{ steps.kernel.outputs.key }}
          cp cache/packages/x86_64/linux-busylinux-*.apk "prebuilt/$key.apk"
          gh release view kernel-cache > /dev/null 2>&1 ||
            gh release create kernel-cache --prerelease --title "Kernel build cache" \
              --notes "Kernels compiled by CI, reused by later runs. Not for installing."
          gh release upload kernel-cache "prebuilt/$key.apk" --clobber
          # Keep the five newest.
          gh release view kernel-cache --json assets \
            --jq '.assets | sort_by(.createdAt) | reverse | .[5:] | .[].name' |
            xargs -r -n1 gh release delete-asset kernel-cache -y

      - name: Boot test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf gdisk dosfstools
          sudo tests/boot-test.sh

      - name: Keep the console log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-test-log
          path: out/boot-test.log
          if-no-files-found: ignore
