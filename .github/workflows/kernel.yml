name: Kernel

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Open a pull request for a new kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new=$(sh .github/kernel-bump.sh)
          [ -n "$new" ] || { echo "the kernel is current"; exit 0; }
          branch=kernel-$new
          git ls-remote --exit-code origin "refs/heads/$branch" && exit 0
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git switch -c "$branch"
          git commit -qam "linux-busylinux: $new"
          git push -q origin "$branch"
          gh pr create --fill --base main --head "$branch"
          # Pull requests opened with this token start no workflows themselves.
          gh workflow run ci.yml --ref "$branch"
