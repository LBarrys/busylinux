name: Kernel

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Delete the branches of finished kernel pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git ls-remote --heads origin 'kernel-*' | sed 's|.*refs/heads/||' | while read -r b; do
            # Only once its pull request is merged or closed, and none is open.
            [ -n "$(gh pr list --head "$b" --state all --json number --jq '.[]')" ] || continue
            [ -z "$(gh pr list --head "$b" --state open --json number --jq '.[]')" ] || continue
            git push -q origin --delete "$b" && echo "deleted $b"
          done

      - name: Open a pull request for a new kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new=$(sh .github/kernel-bump.sh)
          [ -n "$new" ] || { echo "the kernel is current"; exit 0; }
          branch=kernel-$new
          git ls-remote --exit-code origin "refs/heads/$branch" && exit 0
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git switch -c "$branch"
          git commit -qam "linux-busylinux: $new"
          git push -q origin "$branch"
          gh pr create --fill --base main --head "$branch"
          # Pull requests opened with this token start no workflows themselves.
          gh workflow run ci.yml --ref "$branch"
