<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Medium for normal text; light, semibold and bold stay as asked. -->
  <match target="pattern">
    <test name="weight" compare="eq"><const>regular</const></test>
    <edit name="weight" mode="assign"><const>medium</const></edit>
  </match>
  <!-- And when no weight is asked: "all" holds for an empty list. -->
  <match target="pattern">
    <test name="weight" qual="all" compare="eq"><int>-1</int></test>
    <edit name="weight" mode="assign"><const>medium</const></edit>
  </match>

  <!-- Inter's OpenType features, for the programs that read them from
       fontconfig (GTK through Pango, foot); browsers ignore them. calt and
       ccmp are on anyway; dlig is arrows from -> and the like; zero a slashed
       zero; ss01 open digits; ss02 letters told apart (I l 1); ss07 and ss08
       square punctuation and quotes. -->
  <match target="font">
    <test name="family"><string>Inter</string></test>
    <edit name="fontfeatures" mode="append">
      <string>calt</string>
      <string>ccmp</string>
      <string>dlig</string>
      <string>zero</string>
      <string>ss01</string>
      <string>ss02</string>
      <string>ss07</string>
      <string>ss08</string>
    </edit>
  </match>

  <!-- OpenMoji carries its own space, hyphen, digits, # and *, each about
       1.25em wide: take them out so text never borrows them. -->
  <match target="scan">
    <test name="family" compare="contains"><string>OpenMoji</string></test>
    <edit name="charset" mode="assign">
      <minus><name>charset</name><charset><range><int>0x0000</int><int>0x007F</int></range></charset></minus>
    </edit>
  </match>

  <!-- Unifont also draws emoji, in black and white: leave them to OpenMoji. -->
  <match target="scan">
    <test name="family" compare="contains"><string>Unifont</string></test>
    <edit name="charset" mode="assign">
      <minus><name>charset</name><charset>
        <range><int>0x2600</int><int>0x27BF</int></range>
        <range><int>0x1F000</int><int>0x1FAFF</int></range>
      </charset></minus>
    </edit>
  </match>

  <!-- fontconfig prefers colour fonts over the order below, which put
       OpenMoji first for every character. Text asks for plain fonts; OpenMoji
       still draws the emoji the fonts before it lack, and "emoji" keeps colour. -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="color" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans</string></test>
    <edit name="color" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="color" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="color" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>mono</string></test>
    <edit name="color" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Latin, then Arabic and Persian, emoji, CJK, icons, and Unifont for anything left. -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Vazirmatn</family>
      <family>OpenMoji Color</family>
      <family>Sarasa Gothic SC</family>
      <family>Symbols Nerd Font</family>
      <family>Unifont</family>
      <family>Unifont Upper</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>sans</family>
    <prefer>
      <family>Inter</family>
      <family>Vazirmatn</family>
      <family>OpenMoji Color</family>
      <family>Sarasa Gothic SC</family>
      <family>Symbols Nerd Font</family>
      <family>Unifont</family>
      <family>Unifont Upper</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Inter</family>
      <family>Vazirmatn</family>
      <family>OpenMoji Color</family>
      <family>Sarasa Gothic SC</family>
      <family>Symbols Nerd Font</family>
      <family>Unifont</family>
      <family>Unifont Upper</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Fira Code</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Vazirmatn</family>
      <family>OpenMoji Color</family>
      <family>Sarasa Mono SC</family>
      <family>Unifont</family>
      <family>Unifont Upper</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>mono</family>
    <prefer>
      <family>Fira Code</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Vazirmatn</family>
      <family>OpenMoji Color</family>
      <family>Sarasa Mono SC</family>
      <family>Unifont</family>
      <family>Unifont Upper</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>OpenMoji Color</family>
    </prefer>
  </alias>

  <!-- CJK in the shapes of the text's language: Simplified Chinese (SC) unless
       the text says Japanese, Korean, or Traditional Chinese. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>Sarasa Gothic SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarasa Gothic J</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>Sarasa Mono SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarasa Mono J</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>Sarasa Gothic SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarasa Gothic K</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>Sarasa Mono SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarasa Mono K</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>Sarasa Gothic SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarasa Gothic TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>Sarasa Mono SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarasa Mono TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>Sarasa Gothic SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarasa Gothic HC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>Sarasa Mono SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarasa Mono HC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <test name="family"><string>Sarasa Gothic SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarasa Gothic HC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <test name="family"><string>Sarasa Mono SC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarasa Mono HC</string></edit>
  </match>
</fontconfig>
