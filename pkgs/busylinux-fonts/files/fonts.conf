<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Medium for normal text; light, semibold and bold stay as asked. -->
  <match target="pattern">
    <test name="weight" compare="eq"><const>regular</const></test>
    <edit name="weight" mode="assign"><const>medium</const></edit>
  </match>
  <!-- And when no weight is asked: "all" holds for an empty list. -->
  <match target="pattern">
    <test name="weight" qual="all" compare="eq"><int>-1</int></test>
    <edit name="weight" mode="assign"><const>medium</const></edit>
  </match>

  <!-- Latin, then Arabic and Persian, emoji, CJK, icons, and Unifont for anything left. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Vazirmatn</family>
      <family>OpenMoji Color</family>
      <family>Sarasa Gothic SC</family>
      <family>Symbols Nerd Font</family>
      <family>Unifont</family>
      <family>Unifont Upper</family>
    </prefer>
  </alias>
  <alias>
    <family>sans</family>
    <prefer>
      <family>Inter</family>
      <family>Vazirmatn</family>
      <family>OpenMoji Color</family>
      <family>Sarasa Gothic SC</family>
      <family>Symbols Nerd Font</family>
      <family>Unifont</family>
      <family>Unifont Upper</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Inter</family>
      <family>Vazirmatn</family>
      <family>OpenMoji Color</family>
      <family>Sarasa Gothic SC</family>
      <family>Symbols Nerd Font</family>
      <family>Unifont</family>
      <family>Unifont Upper</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Fira Code</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Vazirmatn</family>
      <family>OpenMoji Color</family>
      <family>Sarasa Mono SC</family>
      <family>Unifont</family>
      <family>Unifont Upper</family>
    </prefer>
  </alias>
  <alias>
    <family>mono</family>
    <prefer>
      <family>Fira Code</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Vazirmatn</family>
      <family>OpenMoji Color</family>
      <family>Sarasa Mono SC</family>
      <family>Unifont</family>
      <family>Unifont Upper</family>
    </prefer>
  </alias>
  <alias>
    <family>emoji</family>
    <prefer>
      <family>OpenMoji Color</family>
    </prefer>
  </alias>

  <!-- CJK in the shapes of the text's language: Simplified Chinese (SC) unless
       the text says Japanese, Korean, or Traditional Chinese. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>Sarasa Gothic SC</string></test>
    <edit name="family" mode="assign"><string>Sarasa Gothic J</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>Sarasa Mono SC</string></test>
    <edit name="family" mode="assign"><string>Sarasa Mono J</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>Sarasa Gothic SC</string></test>
    <edit name="family" mode="assign"><string>Sarasa Gothic K</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>Sarasa Mono SC</string></test>
    <edit name="family" mode="assign"><string>Sarasa Mono K</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>Sarasa Gothic SC</string></test>
    <edit name="family" mode="assign"><string>Sarasa Gothic TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>Sarasa Mono SC</string></test>
    <edit name="family" mode="assign"><string>Sarasa Mono TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>Sarasa Gothic SC</string></test>
    <edit name="family" mode="assign"><string>Sarasa Gothic HC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>Sarasa Mono SC</string></test>
    <edit name="family" mode="assign"><string>Sarasa Mono HC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <test name="family"><string>Sarasa Gothic SC</string></test>
    <edit name="family" mode="assign"><string>Sarasa Gothic HC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <test name="family"><string>Sarasa Mono SC</string></test>
    <edit name="family" mode="assign"><string>Sarasa Mono HC</string></edit>
  </match>
</fontconfig>
