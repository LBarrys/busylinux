# The CPU's frequency policy, set by the cpu service. Empty: the kernel's
# default. Takes effect within a minute, or now with
# doas sv restart /etc/service/cpu.
#
#   EPP    the energy-performance preference of amd-pstate-epp (and
#          intel_pstate): performance, balance_performance (the kernel's
#          default), balance_power or power. balance_power still boosts,
#          less eagerly: cooler and quieter under load.
#   BOOST  1 or 0. 0 holds the cores at their base clock (4.2 GHz on a
#          7800X3D): much cooler, about 5-10% slower on one thread.
EPP=
BOOST=
