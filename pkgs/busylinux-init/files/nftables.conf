#!/usr/sbin/nft -f

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		ip protocol icmp accept
		ip6 nexthdr ipv6-icmp accept

		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept

		# DNS from Podman containers to the aardvark-dns it runs on the host
		iifname "podman*" udp dport 53 accept
		iifname "podman*" tcp dport 53 accept

		# tcp dport 27036 accept
		# udp dport { 27031, 27036 } accept

		counter

		# Logging needs CONFIG_NF_LOG_SYSLOG in the kernel (release 9 and up):
		# limit rate 5/minute log prefix "nft-drop " level info
	}

	chain forward {
		type filter hook forward priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop

		# Containers behind a Docker or Podman bridge may reach out, and
		# ports those tools publish (DNAT) may reach in. Nothing else is
		# forwarded.
		iifname "docker0" accept
		iifname "br-*" accept
		iifname "podman*" accept
		ct status dnat accept
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
