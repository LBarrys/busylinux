# A sched_ext scheduler, run in place of the kernel's own (EEVDF) by the scx
# service. Empty: none. Takes effect within a minute, or now with
# doas sv restart /etc/service/scx. If it fails, the kernel switches back.
#
#   scx_simple   one queue for all CPUs, ordered by weighted run time; suits
#                a CPU whose cores share one L3 cache, like the 7800X3D
#
# ARGS: -f for first-in first-out instead.
SCHEDULER=
ARGS=
